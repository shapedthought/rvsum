name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: shapedthought/rvsum

jobs:
  build-binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rvsum
            asset: rvsum-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: rvsum
            asset: rvsum-linux-aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rvsum.exe
            asset: rvsum-windows-x86_64.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: rvsum
            asset: rvsum-macos-x86_64
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bin: rvsum
            asset: rvsum-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          DEST="${{ matrix.asset }}"
          cp "$SRC" "$DEST"
          strip "$DEST" || true

      # Signs and notarises macOS binaries with a Developer ID certificate.
      # Skipped (unsigned build, as before) when the secrets are not set.
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != ''
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DEST="${{ matrix.asset }}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/api_key.p8"' EXIT
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          codesign --force --timestamp --options runtime \
            --keychain "$KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$DEST"
          codesign --verify --strict --verbose=2 "$DEST"
          # Bare CLI binaries cannot be stapled; Gatekeeper checks the
          # notarisation ticket online on first run.
          ditto -c -k --keepParent "$DEST" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/api_key.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m

      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ matrix.asset }}"
          sha256sum "$DEST" | tee "${DEST}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"
          Get-Content "${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvsum-${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  container:
    name: container (amd64+arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: [build-binaries, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rvsum-*
          merge-multiple: true
          path: dist

      - name: List assets
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
